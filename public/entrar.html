<!DOCTYPE html>
<html lang="pt" data-bs-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GPI Track — Gestão de Projetos em Equipa</title>
<link rel="stylesheet" href="/css/styles.css" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0B1220" />
</head>
<body>
  <div class="auth-shell">

    <div class="auth-panel">
      <div class="auth-card">
        <a href="/" class="auth-marca">
          <img src="/img/unikivi-logo.png" alt="Unikivi" />
          <b>GPI Track</b>
        </a>
        <div class="tabs">
          <div class="tab-btn active" data-tab="login">Entrar</div>
          <div class="tab-btn" data-tab="registo">Criar conta</div>
        </div>

        <div id="painel-login">
          <h2>Trabalhe em equipa, em tempo real</h2>
          <div class="sub">Entre e veja o seu projeto avançar ao vivo.</div>
          <div class="error-box" id="erro-login"></div>
          <form id="form-login">
            <div class="field">
              <label>E-mail</label>
              <input type="email" id="login-email" placeholder="voce@equipa.ao" required />
            </div>
            <div class="field">
              <label>Password</label>
              <div class="campo-senha">
                <input type="password" id="login-password" placeholder="••••••••" required />
                <button type="button" class="ver-senha" data-alvo="login-password" title="Mostrar/esconder password">👁</button>
              </div>
            </div>
            <div class="linha-esqueci"><a class="link-discreto" href="/esqueci-senha.html">Esqueceu a password?</a></div>
            <button class="btn btn-primary" type="submit">Entrar</button>
          </form>
          <div id="bloco-google-login" style="display:none">
            <div class="divisor-ou">ou</div>
            <div class="google-slot" id="google-login"></div>
          </div>
        </div>

        <div id="painel-mfa" style="display:none">
          <h2>Verificação em dois passos</h2>
          <div class="sub">Introduza o código de 6 dígitos da sua app autenticadora.</div>
          <div class="error-box" id="erro-mfa"></div>
          <form id="form-mfa">
            <div class="field">
              <label>Código</label>
              <input type="text" id="mfa-codigo" inputmode="numeric" maxlength="6" placeholder="000000" autofocus required />
            </div>
            <button class="btn btn-primary" type="submit">Entrar</button>
            <button class="btn" type="button" style="width:100%;margin-top:8px" onclick="cancelarMFA()">Cancelar</button>
          </form>
        </div>

        <div id="painel-registo" style="display:none">
          <h2>Criar a sua conta</h2>
          <div class="sub">Comece a acompanhar o seu projeto em minutos.</div>
          <div class="error-box" id="erro-registo"></div>
          <form id="form-registo">
            <div class="field">
              <label>Nome completo</label>
              <input type="text" id="reg-nome" placeholder="O seu nome" required />
            </div>
            <div class="field">
              <label>E-mail</label>
              <input type="email" id="reg-email" placeholder="voce@equipa.ao" required />
            </div>
            <div class="field">
              <label>Password</label>
              <div class="campo-senha">
                <input type="password" id="reg-password" placeholder="Crie uma password segura" maxlength="128" autocomplete="new-password" required />
                <button type="button" class="ver-senha" data-alvo="reg-password" title="Mostrar/esconder password">👁</button>
              </div>
            </div>
            <div class="senha-medidor" id="medidor-registo"></div>
            <div class="field">
              <label>Confirmar password</label>
              <input type="password" id="reg-password2" placeholder="Repita a password" maxlength="128" autocomplete="new-password" required />
            </div>
            <button class="btn btn-primary" type="submit" id="btn-criar-conta" disabled>Criar conta</button>
          </form>
          <div id="bloco-google-registo" style="display:none">
            <div class="divisor-ou">ou</div>
            <div class="google-slot" id="google-registo"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/password-strength.js"></script>
  <script>
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        document.getElementById("painel-login").style.display = tab === "login" ? "block" : "none";
        document.getElementById("painel-registo").style.display = tab === "registo" ? "block" : "none";
      });
    });

    if (new URLSearchParams(window.location.search).get("criar") === "1") {
      document.querySelector('.tab-btn[data-tab="registo"]').click();
    }

    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const erroBox = document.getElementById("erro-login");
      erroBox.style.display = "none";
      try {
        const resposta = await api.post("/api/auth/login", {
          email: document.getElementById("login-email").value,
          password: document.getElementById("login-password").value,
        });
        if (resposta.mfa_required) {
          mfaTokenPendente = resposta.mfa_token;
          document.getElementById("painel-login").style.display = "none";
          document.getElementById("painel-registo").style.display = "none";
          document.querySelector(".tabs").style.display = "none";
          document.getElementById("painel-mfa").style.display = "block";
          document.getElementById("mfa-codigo").focus();
          return;
        }
        sessao.guardarToken(resposta.token);
        window.location.href = "/projetos.html";
      } catch (err) {
        erroBox.textContent = err.message;
        erroBox.style.display = "block";
      }
    });

    // ---- Segundo passo: código de 6 dígitos (2FA/TOTP) ----
    let mfaTokenPendente = null;
    document.getElementById("form-mfa").addEventListener("submit", async (e) => {
      e.preventDefault();
      const erroBox = document.getElementById("erro-mfa");
      erroBox.style.display = "none";
      try {
        const { token } = await api.post("/api/auth/mfa/verificar-login", {
          mfa_token: mfaTokenPendente,
          code: document.getElementById("mfa-codigo").value.trim(),
        });
        sessao.guardarToken(token);
        window.location.href = "/projetos.html";
      } catch (err) {
        erroBox.textContent = err.message;
        erroBox.style.display = "block";
      }
    });
    function cancelarMFA() {
      mfaTokenPendente = null;
      document.getElementById("painel-mfa").style.display = "none";
      document.querySelector(".tabs").style.display = "flex";
      document.getElementById("painel-login").style.display = "block";
      document.getElementById("form-login").reset();
    }

    // ---- Barra de força da password ----
    let senhaAceite = false;
    ligarMedidorSenha("reg-password", "medidor-registo", (r) => {
      senhaAceite = r.aceite;
      document.getElementById("btn-criar-conta").disabled = !r.aceite;
    });

    // ---- Mostrar/esconder password ----
    document.querySelectorAll(".ver-senha").forEach((b) => {
      b.addEventListener("click", () => {
        const campo = document.getElementById(b.dataset.alvo);
        campo.type = campo.type === "password" ? "text" : "password";
      });
    });

    // ---- Entrar com o Google ----
    // O botão só aparece se o servidor tiver GOOGLE_CLIENT_ID configurado.
    async function iniciarGoogle() {
      let clientId = null;
      try { clientId = (await api.get("/api/auth/config")).googleClientId; } catch {}
      if (!clientId) return;

      await new Promise((resolve, reject) => {
        const sc = document.createElement("script");
        sc.src = "https://accounts.google.com/gsi/client";
        sc.async = true;
        sc.onload = resolve;
        sc.onerror = reject;
        document.head.appendChild(sc);
      }).catch(() => null);
      if (!window.google?.accounts?.id) return;

      google.accounts.id.initialize({
        client_id: clientId,
        callback: async ({ credential }) => {
          const painelRegisto = document.getElementById("painel-registo").style.display !== "none";
          const erroBox = document.getElementById(painelRegisto ? "erro-registo" : "erro-login");
          erroBox.style.display = "none";
          try {
            const { token, novo } = await api.post("/api/auth/google", { credential });
            sessao.guardarToken(token);
            window.location.href = novo ? "/onboarding.html" : "/projetos.html";
          } catch (err) {
            erroBox.textContent = err.message;
            erroBox.style.display = "block";
          }
        },
      });
      ["login", "registo"].forEach((k) => {
        document.getElementById("bloco-google-" + k).style.display = "block";
        google.accounts.id.renderButton(document.getElementById("google-" + k), {
          theme: "outline", size: "large", shape: "pill", width: 300,
          text: k === "registo" ? "signup_with" : "signin_with", locale: "pt-PT",
        });
      });
    }
    iniciarGoogle();

    document.getElementById("form-registo").addEventListener("submit", async (e) => {
      e.preventDefault();
      const erroBox = document.getElementById("erro-registo");
      erroBox.style.display = "none";
      if (!senhaAceite) {
        erroBox.textContent = "Escolha uma password mais forte (pelo menos \"Razoável\").";
        erroBox.style.display = "block";
        return;
      }
      if (document.getElementById("reg-password").value !== document.getElementById("reg-password2").value) {
        erroBox.textContent = "As duas passwords não coincidem.";
        erroBox.style.display = "block";
        return;
      }
      try {
        const { token } = await api.post("/api/auth/registar", {
          name: document.getElementById("reg-nome").value,
          email: document.getElementById("reg-email").value,
          password: document.getElementById("reg-password").value,
        });
        sessao.guardarToken(token);
        window.location.href = "/onboarding.html";
      } catch (err) {
        erroBox.textContent = err.message;
        erroBox.style.display = "block";
      }
    });
  </script>
  <script src="/js/voltar.js"></script>
</body>
</html>
